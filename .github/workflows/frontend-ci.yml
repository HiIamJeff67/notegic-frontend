name: Notegic Frontend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notegic-frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment:
    name: Frontend environment parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_APP_BASE_PATH: /
      E2E_RUN_AUTHENTICATED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium --only-shell
      - name: Runtime smoke tests against development server
        run: npm run test:environment
      - name: Build Web SSR output
        run: npm run build:web
      - name: Runtime smoke tests against production SSR output
        env:
          E2E_PRODUCTION: "true"
        run: npm run test:environment
      - name: Build Web Cloudflare Workers output
        run: npm run build:web:cloudflare
